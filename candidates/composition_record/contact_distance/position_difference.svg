    <text x="369" y="443" font-size="20" fill="#414c54">0</text>
    <rect x="418" y="387" width="98" height="98" fill="#7e1640" stroke="#adb6bb"/>
    <text x="467" y="443" font-size="20" fill="white">−t/128</text>
